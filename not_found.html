<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }

    .bg-animated {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #0c4a6e 100%);
      background-size: 300% 300%;
      animation: shift 12s ease infinite;
    }
    @keyframes shift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: .15; pointer-events: none;
      animation: float 9s ease-in-out infinite;
    }
    .orb-1 { width:400px;height:400px;background:#6366f1;top:-100px;left:-80px; }
    .orb-2 { width:300px;height:300px;background:#0ea5e9;bottom:-80px;right:-60px;animation-delay:-4s; }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-30px); }
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(28px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .slide-up { animation: slideUp .55s cubic-bezier(.16,1,.3,1) both; }

    @keyframes pulse404 {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.7; transform:scale(.97); }
    }
    .num-pulse { animation: pulse404 3s ease-in-out infinite; }

    .btn-glass {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background .2s, transform .15s;
    }
    .btn-glass:hover { background: rgba(255,255,255,0.18); }
    .btn-glass:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 18px rgba(99,102,241,.4);
      transition: filter .15s, transform .15s;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:active { transform: scale(.97); }
  </style>
</head>
<body class="bg-animated min-h-screen relative overflow-hidden flex items-center justify-center px-5">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="slide-up relative z-10 text-center max-w-md space-y-8">

    <!-- 404 Number -->
    <div class="num-pulse select-none">
      <p class="text-[120px] sm:text-[160px] font-black leading-none tracking-tight"
         style="background:linear-gradient(135deg,#818cf8,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
        404
      </p>
    </div>

    <!-- Message -->
    <div class="space-y-3">
      <h1 class="text-2xl font-black text-white">Halaman Tidak Ditemukan</h1>
      <p class="text-slate-400 text-sm leading-relaxed">
        Halaman yang kamu cari tidak ada atau mungkin sudah dipindahkan.<br/>
        Yuk kembali ke aplikasi.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center gap-3 flex-wrap">
      <a href="/"
        class="btn-primary px-6 py-3 rounded-2xl text-white font-bold text-sm inline-flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Kembali ke Beranda
      </a>
      <button onclick="history.back()"
        class="btn-glass px-6 py-3 rounded-2xl text-white font-semibold text-sm">
        ← Halaman Sebelumnya
      </button>
    </div>

    <!-- Decorative pill icon -->
    <div class="pt-4 opacity-30">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-indigo-300 mx-auto" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 20H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H20a2 2 0 0 1 2 2v3"/>
        <circle cx="18" cy="18" r="4"/><path d="m15.5 15.5 5 5"/>
      </svg>
      <p class="text-xs text-slate-600 mt-2">Polypharmacy Collision Detector</p>
    </div>

  </div>

  <script>
    // Apply saved theme
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
