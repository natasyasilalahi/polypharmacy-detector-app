<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#0b0f19',
            },
            brand: {
              500: '#3b82f6',
              600: '#2563eb',
            },
            indigo: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
    *, body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; }

    .mesh-404 {
      background:
        radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        #f8fafc;
    }
    .dark .mesh-404 {
      background:
        radial-gradient(at 20% 20%, rgba(79, 70, 229, 0.18) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        #0b0f19;
    }

    .num-grad {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #0ea5e9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="mesh-404 min-h-screen text-slate-800 dark:text-slate-100 flex items-center justify-center p-6 transition-colors duration-300">

  <div class="text-center max-w-md space-y-6">
    <div class="select-none">
      <p class="text-[110px] sm:text-[140px] font-black leading-none tracking-tight num-grad">
        404
      </p>
    </div>

    <div class="space-y-2">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">Halaman Tidak Ditemukan</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
        Tautan yang Anda tuju tidak tersedia atau telah dipindahkan ke direktori lain.
      </p>
    </div>

    <div class="flex items-center justify-center gap-3 flex-wrap pt-2">
      <a href="/"
        class="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold text-xs uppercase tracking-wider inline-flex items-center gap-2 shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-105 active:scale-95 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Kembali ke Beranda
      </a>
      <button onclick="history.back()"
        class="px-5 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/60 transition shadow-xs">
        ← Halaman Sebelumnya
      </button>
    </div>

    <div class="pt-6 border-t border-slate-200/80 dark:border-slate-800/80 flex items-center justify-center gap-2 text-xs text-slate-400">
      <span>Polypharmacy Collision Detector</span>
    </div>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
