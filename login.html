<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Polypharmacy Collision Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#0b0f19',
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    *, body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      letter-spacing: -0.011em;
    }

    .login-mesh {
      background:
        radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(59, 130, 246, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.08) 0px, transparent 50%),
        #f8fafc;
    }
    .dark .login-mesh {
      background:
        radial-gradient(at 10% 20%, rgba(79, 70, 229, 0.18) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(37, 99, 235, 0.16) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.1) 0px, transparent 50%),
        #0b0f19;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
    }
    .dark .glass-box {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(51, 65, 85, 0.7);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .inp-field {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      color: #0f172a;
      transition: all 0.2s ease;
    }
    .dark .inp-field {
      background: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }
    .inp-field:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn-main {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.35);
    }
    .btn-main:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 12px 25px -4px rgba(79, 70, 229, 0.45);
    }
    .btn-main:active {
      transform: scale(0.985);
    }

    .tab-btn {
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .dark .tab-btn.active {
      background: #1e293b;
      color: #f8fafc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    @keyframes popEnter {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pop-enter {
      animation: popEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
</head>
<body class="min-h-screen login-mesh text-slate-800 dark:text-slate-100 flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">

  <!-- Top bar controls -->
  <header class="fixed top-4 right-4 z-50 flex items-center gap-2">
    <a href="/" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 backdrop-blur-md transition shadow-xs">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      Beranda
    </a>
    <button onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Mode"
      class="w-8 h-8 rounded-xl bg-white/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 flex items-center justify-center text-sm backdrop-blur-md transition hover:scale-105 shadow-xs">
      🌙
    </button>
  </header>

  <main class="w-full max-w-[420px] pop-enter">
    <!-- Brand badge & logo -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-600 text-white shadow-xl shadow-indigo-500/25 mb-3.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.5 20H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H20a2 2 0 0 1 2 2v3"/>
          <circle cx="18" cy="18" r="4"/><path d="m15.5 15.5 5 5"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Polypharmacy AI</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Platform Klinis Deteksi Interaksi Obat Berbahaya</p>
    </div>

    <!-- Main Card -->
    <div class="glass-box rounded-3xl p-6 sm:p-7">

      <!-- Navigation Tabs -->
      <nav class="flex p-1 bg-slate-100 dark:bg-slate-800/80 rounded-2xl mb-5" aria-label="Tab Autentikasi">
        <button id="tabLogin" onclick="switchTab('login')"
          class="tab-btn active flex-1 py-2 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400">
          Masuk Akun
        </button>
        <button id="tabRegister" onclick="switchTab('register')"
          class="tab-btn flex-1 py-2 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400">
          Daftar Baru
        </button>
      </nav>

      <!-- Alert Banner -->
      <div id="banner" class="hidden mb-4 p-3 rounded-2xl text-xs font-semibold flex items-center gap-2"></div>

      <!-- Form Login -->
      <form id="formLogin" onsubmit="submitLogin(event)" class="space-y-4">
        <div>
          <label for="loginUser" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </span>
            <input id="loginUser" type="text" autocomplete="username" placeholder="Contoh: dokter / apoteker"
              class="inp-field w-full rounded-2xl pl-10 pr-4 py-2.5 text-sm" />
          </div>
        </div>

        <div>
          <label for="loginPass" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"
              class="inp-field w-full rounded-2xl pl-10 pr-10 py-2.5 text-sm" />
            <button type="button" onclick="togglePwd('loginPass', this)" aria-label="Lihat Password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLogin"
          class="btn-main w-full py-3 rounded-2xl text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 mt-2">
          <span>Masuk Sistem</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <!-- Quick Demo Profiles -->
        <div class="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-2.5">
          <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center">Akun Demo Langsung (1-Klik)</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="quickLogin('apoteker', 'apoteker123')"
              class="p-2.5 rounded-xl border border-indigo-100 dark:border-indigo-900/60 bg-indigo-50/70 dark:bg-indigo-950/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-xs">
              <span>💊</span>
              <span>Apoteker</span>
            </button>
            <button type="button" onclick="quickLogin('dokter', 'dokter123')"
              class="p-2.5 rounded-xl border border-blue-100 dark:border-blue-900/60 bg-blue-50/70 dark:bg-blue-950/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 text-blue-700 dark:text-blue-300 text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-xs">
              <span>🩺</span>
              <span>Dokter</span>
            </button>
          </div>

          <button type="button" onclick="guestLogin()"
            class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold transition flex items-center justify-center gap-2 shadow-xs">
            <span>🚀</span>
            <span>Masuk sebagai Tamu (Uji Coba Cepat)</span>
          </button>
        </div>
      </form>

      <!-- Form Register -->
      <form id="formRegister" onsubmit="submitRegister(event)" class="space-y-4 hidden">
        <div>
          <label for="regUser" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Username Baru</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </span>
            <input id="regUser" type="text" autocomplete="username" placeholder="Masukkan username unik"
              class="inp-field w-full rounded-2xl pl-10 pr-4 py-2.5 text-sm" />
          </div>
        </div>

        <div>
          <label for="regPass" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="regPass" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"
              class="inp-field w-full rounded-2xl pl-10 pr-10 py-2.5 text-sm" />
            <button type="button" onclick="togglePwd('regPass', this)" aria-label="Lihat Password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Password Strength Meter -->
        <div id="strengthBar" class="hidden space-y-1.5">
          <div class="flex gap-1.5">
            <div id="s1" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-all duration-300"></div>
            <div id="s2" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-all duration-300"></div>
            <div id="s3" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-all duration-300"></div>
            <div id="s4" class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700 transition-all duration-300"></div>
          </div>
          <p id="strengthLabel" class="text-[11px] font-semibold text-slate-500"></p>
        </div>

        <div>
          <label for="regPass2" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Konfirmasi Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
            </span>
            <input id="regPass2" type="password" autocomplete="new-password" placeholder="Ulangi password"
              class="inp-field w-full rounded-2xl pl-10 pr-4 py-2.5 text-sm" />
          </div>
        </div>

        <button type="submit" id="btnRegister"
          class="btn-main w-full py-3 rounded-2xl text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 mt-2">
          <span>Daftar Akun Baru</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>
          </svg>
        </button>
      </form>

    </div>

    <!-- Security Footer -->
    <p class="text-center text-[11px] text-slate-400 mt-5">
      Dilindungi sistem enkripsi sesi lokal · Prototype Hackathon
    </p>
  </main>

  <script>
    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = dark ? '☀️' : '🌙';
    }
    function toggleTheme() {
      const dark = !document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      applyTheme(dark);
    }
    applyTheme(localStorage.getItem('theme') === 'dark');

    // Auto-redirect if session is active
    fetch('/api/me')
      .then(r => r.json())
      .then(data => {
        if (data && data.ok && !data.is_guest) location.href = '/';
      })
      .catch(() => {});

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const isPwd = inp.type === 'password';
      inp.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd
        ? `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }

    // Password strength calculation
    document.getElementById('regPass').addEventListener('input', function() {
      const val = this.value;
      const bar = document.getElementById('strengthBar');
      const segs = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
      const label = document.getElementById('strengthLabel');
      if (!val) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');

      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { color: 'bg-rose-500', text: 'Sangat Lemah', labelColor: 'text-rose-500' },
        { color: 'bg-amber-500', text: 'Cukup', labelColor: 'text-amber-500' },
        { color: 'bg-blue-500', text: 'Bagus', labelColor: 'text-blue-500' },
        { color: 'bg-emerald-500', text: 'Kuat & Aman', labelColor: 'text-emerald-500' },
      ];
      const lvl = levels[Math.max(0, score - 1)];
      segs.forEach((s, i) => {
        s.className = `h-1 flex-1 rounded-full transition-all duration-300 ${i < score ? lvl.color : 'bg-slate-200 dark:bg-slate-700'}`;
      });
      label.className = `text-[11px] font-semibold ${lvl.labelColor}`;
      label.textContent = lvl.text;
    });

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('formLogin').classList.toggle('hidden', !isLogin);
      document.getElementById('formRegister').classList.toggle('hidden', isLogin);
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      hideBanner();
    }

    function showBanner(msg, ok) {
      const b = document.getElementById('banner');
      b.className = `mb-4 p-3 rounded-2xl text-xs font-semibold flex items-center gap-2 ${
        ok ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800'
           : 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800'
      }`;
      b.innerHTML = `<span>${ok ? '✓' : '⚠️'}</span><span>${msg}</span>`;
      b.classList.remove('hidden');
    }
    function hideBanner() {
      document.getElementById('banner').classList.add('hidden');
    }

    function setBtn(id, loading) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.disabled = loading;
      btn.style.opacity = loading ? '0.7' : '1';
    }

    const nextUrl = new URLSearchParams(location.search).get('next') || '/';

    function guestLogin() {
      location.href = nextUrl;
    }

    async function quickLogin(user, pass) {
      document.getElementById('loginUser').value = user;
      document.getElementById('loginPass').value = pass;
      setBtn('btnLogin', true);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        setBtn('btnLogin', false);
        if (data.ok) location.href = nextUrl;
        else showBanner(data.message || 'Login gagal.', false);
      } catch (err) {
        setBtn('btnLogin', false);
        showBanner('Koneksi ke server gagal.', false);
      }
    }

    async function submitLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) { showBanner('Silakan isi username dan password.', false); return; }
      setBtn('btnLogin', true);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        setBtn('btnLogin', false);
        if (data.ok) location.href = nextUrl;
        else showBanner(data.message || 'Username atau password salah.', false);
      } catch (err) {
        setBtn('btnLogin', false);
        showBanner('Koneksi ke server gagal.', false);
      }
    }

    async function submitRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      const password2 = document.getElementById('regPass2').value;
      if (!username || !password) { showBanner('Silakan lengkapi semua data.', false); return; }
      if (password.length < 6) { showBanner('Password minimal 6 karakter.', false); return; }
      if (password !== password2) { showBanner('Konfirmasi password tidak cocok.', false); return; }
      setBtn('btnRegister', true);
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        setBtn('btnRegister', false);
        if (data.ok) location.href = nextUrl;
        else showBanner(data.message || 'Pendaftaran gagal.', false);
      } catch (err) {
        setBtn('btnRegister', false);
        showBanner('Koneksi ke server gagal.', false);
      }
    }
  </script>
</body>
</html>
